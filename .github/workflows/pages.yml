name: Deploy to GitHub Pages

# Publishes app/ as a static site after the tests pass. Enable it once under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Stamp the commit into the service worker cache name and the build id,
      # so every deploy reaches installed apps even if the version was not bumped.
      - name: Stamp build id
        run: |
          short="${GITHUB_SHA::7}"
          sed -i "s/const CACHE_NAME = 'lnf-runlog-v\([0-9.]*\)-dev';/const CACHE_NAME = 'lnf-runlog-v\1-${short}';/" app/sw.js
          sed -i "s/export const APP_BUILD = 'dev';/export const APP_BUILD = '${short}';/" app/version.js
          grep -q "lnf-runlog-v[0-9.]*-${short}" app/sw.js
          grep -q "APP_BUILD = '${short}'" app/version.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
